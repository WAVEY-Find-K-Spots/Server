# [Project Information]
spring:
  application:
    name: ${APP_NAME:WaveyService}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 2s
      timeout: 2s
  config:
    import: optional:file:.env[.properties]

  # [Google Cloud API Configuration]
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:}
      credentials:
        encoded-key: ${GCP_JSON_CREDENTIALS_BASE64:}

  # [Social Login Configuration]
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            #apple:
            #client-id: ${APPLE_CLIENT_ID}
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # [Database Configuration]
  datasource:
    url: ${PG_URL:jdbc:postgresql://localhost:5432/wavey_db}
    username: ${PG_USERNAME:postgres}
    password: ${PG_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

#    # H2 Database (임시 신기능 테스트용) ---
#    url: ${H2_URL:jdbc:h2:mem:testdb}
#    username: ${H2_USERNAME:sa}
#    password: ${H2_PASSWORD:}
#    driver-class-name: org.h2.Driver

  # [H2 Console Settings]
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: ${H2_CONSOLE_WEB_ALLOW_OTHERS:false}

  # [JPA & Hibernate Settings]
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # [JSON Serialization Setup]
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Seoul

# --- [수정 포인트] spring 계층 밖(맨 왼쪽)으로 이동하여 Placeholder 에러 해결 ---
auth:
  allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000}
  login-code-ttl: ${AUTH_LOGIN_CODE_TTL:3m}
  server-url: ${SERVER_URL:http://localhost:8080}
  frontend-redirect-uri: ${AUTH_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/callback}
  base-url: ${AUTH_BASE_URL:/oauth2/authorization/}
  google-path: ${GOOGLE_AUTH_PATH:google}
  apple-path: ${APPLE_AUTH_PATH:apple}
  kakao-path: ${KAKAO_AUTH_PATH:kakao}
  admin-white-list: ${ADMIN_EMAILS}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

jwt:
  secret: ${key}
  access-token-expiration: ${a_exp}
  refresh-token-expiration: ${r_exp}

external-api:
  service-key: ${PUBLIC_DATA_SERVICE_KEY}
  tour:
    base-url: https://apis.data.go.kr/B551011/KorService2
  media-location:
    base-url: https://api.odcloud.kr/api/15111405/v1/uddi:d8741b9c-f484-4ea8-8f54-bd21ab62de14
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    base-url: https://www.googleapis.com/youtube/v3
  spotify:
    client-id: ${SPOTIFY_CLIENT_ID:}
    client-secret: ${SPOTIFY_CLIENT_SECRET:}
    token-url: https://accounts.spotify.com/api/token
    base-url: https://api.spotify.com/v1

# 작품 자동 수집 컷오프. 검색 클라이언트가 아니라 정책이 이 값을 읽는다.
media-collect:
  youtube:
    max-duration-sec: 1200
    max-keep: 8
  spotify:
    max-keep: 15
    max-kpop-keep: 3
    max-duration-ms: 2400000

tmap:
  base-url: ${TMAP_BASE_URL:https://apis.openapi.sk.com}
  app-key: ${TMAP_APP_KEY:}
  directions-cache-ttl-seconds: ${TMAP_DIRECTIONS_CACHE_TTL_SECONDS:300}

spot:
  sync:
    scheduler:
      enabled: ${SPOT_SYNC_SCHEDULER_ENABLED:false}
      media-location-cron: ${SPOT_SYNC_MEDIA_LOCATION_CRON:0 0 3 * * *}
      thumbnail-cron: ${SPOT_SYNC_THUMBNAIL_CRON:0 0 4 * * *}
      media-location-per-page: ${SPOT_SYNC_MEDIA_LOCATION_PER_PAGE:300}
      thumbnail-limit: ${SPOT_SYNC_THUMBNAIL_LIMIT:50}

# [OCR Translation Configuration]
translation:
  dictionary:
    dataset-path: ${TRANSLATION_DICTIONARY_DATASET_PATH:classpath:datasets/translation-terms.json}
  google:
    base-url: ${GOOGLE_TRANSLATION_BASE_URL:https://translation.googleapis.com}
    location: ${GOOGLE_TRANSLATION_LOCATION:us-central1}
    glossary-id: ${GOOGLE_TRANSLATION_GLOSSARY_ID:}

heritage:
  dataset-path: ${HERITAGE_DATASET_PATH:classpath:datasets/heritage-list.json}
  google-geocoding:
    base-url: ${GOOGLE_GEOCODING_BASE_URL:https://maps.googleapis.com}
    api-key: ${GOOGLE_GEOCODING_API_KEY:}

vision:
  rate-limit:
    enabled: ${VISION_RATE_LIMIT_ENABLED:true}
    max-requests: ${VISION_RATE_LIMIT_MAX_REQUESTS:30}
    window-seconds: ${VISION_RATE_LIMIT_WINDOW_SECONDS:60}
# [Logging Configuration]
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# [Swagger / OpenAPI Documentation]
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
